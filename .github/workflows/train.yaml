name: Train NFL Model

# Runs every Tuesday at 10:00 UTC (after Monday Night Football has finished
# and results are in), plus you can trigger it manually anytime from the
# Actions tab.
on:
  schedule:
    - cron: "0 10 * * 2"
  workflow_dispatch: {}

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch NFL data
        run: python fetch_data.py

      - name: Build features
        run: python features.py

      - name: Train model
        run: python train.py

      # GitHub Actions runners are thrown away after each run, so we save
      # the trained model as a downloadable artifact. The predict workflow
      # picks this up automatically.
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: nfl-model
          path: nfl_model.pkl
          retention-days: 14
