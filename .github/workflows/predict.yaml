name: Run NFL Predictions

# Runs Mon/Thu/Sun at 14:00 UTC (NFL's main game days, so odds are freshest
# right before/around those games), plus manual trigger anytime. Trains a
# fresh model each run (fast, ~30s) rather than depending on a separate
# workflow's artifact — simpler and avoids cross-workflow permission issues.
#
# Changed from daily to 3x/week to stay well under SportsGameOdds's
# 2,500 entities/month free-tier cap — a full run (odds + player props
# for ~16 games) uses ~80 entities, so daily would risk ~2,400+/month.
on:
  schedule:
    - cron: "0 14 * * 1,4,0"
  workflow_dispatch: {}

jobs:
  predict:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch NFL data
        run: python fetch_data.py

      - name: Build features
        run: python features.py

      - name: Train model
        run: python train.py

      - name: Fetch player data
        run: python fetch_player_data.py

      - name: Build player features
        run: python player_features.py

      - name: Train player props models
        run: python train_props.py

      - name: Run predictions
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python predict.py

      - name: Commit predictions.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update predictions [automated]"
          file_pattern: predictions.json
