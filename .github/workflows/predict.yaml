name: Run NFL Predictions

# Runs daily at 14:00 UTC (adjust to your timezone/needs) to check upcoming
# games against live odds, plus manual trigger anytime.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Predictions need the trained model + feature history. Rather than
      # retraining every day, we reuse the artifact from the most recent
      # successful Train NFL Model run.
      - name: Download latest trained model
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: train.yml
          name: nfl-model
          path: .

      - name: Rebuild feature history
        run: |
          python fetch_data.py
          python features.py

      - name: Run predictions
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python predict.py

      - name: Commit predictions.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update predictions [automated]"
          file_pattern: predictions.json
