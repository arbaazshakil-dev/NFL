<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Signal Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --turf: #0B2818;
    --turf-line: #163A26;
    --chalk: #F4F1EA;
    --chalk-dim: #A9BBAE;
    --amber: #E8A33D;
    --steel: #6E93AC;
    --redflag: #C24E4E;
    --green: #4FA36B;
    --row-border: rgba(244, 241, 234, 0.09);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--turf);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 28px 20px 20px;
    border-bottom: 2px solid var(--turf-line);
  }

  .eyebrow {
    color: var(--amber);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 34px;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .updated {
    color: var(--chalk-dim);
    font-size: 13px;
    margin-top: 8px;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 0 60px;
  }

  .empty-state {
    margin: 60px 20px;
    padding: 32px 24px;
    border: 1px dashed var(--turf-line);
    text-align: center;
    color: var(--chalk-dim);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ---- Collapsed row (the tappable summary) ---- */

  .game {
    border-bottom: 1px solid var(--row-border);
  }

  .game-summary {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    cursor: pointer;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
    color: inherit;
    font: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .game-summary:active {
    background: rgba(244, 241, 234, 0.04);
  }

  .call-bar {
    width: 4px;
    align-self: stretch;
    min-height: 40px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .call-bar.good { background: var(--green); }
  .call-bar.risk { background: var(--redflag); }
  .call-bar.neutral { background: var(--turf-line); }

  .summary-main {
    flex: 1;
    min-width: 0;
  }

  .summary-teams {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 17px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .summary-sub {
    color: var(--chalk-dim);
    font-size: 12.5px;
    margin-top: 3px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .summary-pick {
    color: var(--chalk);
  }

  .signal-count {
    font-size: 11px;
    padding: 2px 7px;
    background: rgba(244, 241, 234, 0.08);
    border-radius: 10px;
    color: var(--chalk-dim);
  }

  .signal-count.has-signals {
    color: var(--turf);
    background: var(--green);
    font-weight: 600;
  }

  .chevron {
    color: var(--chalk-dim);
    font-size: 13px;
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }

  .game[open] .chevron {
    transform: rotate(90deg);
  }

  /* Hide native <details> marker */
  .game > summary::-webkit-details-marker,
  .game > summary::marker {
    display: none;
    content: '';
  }

  /* ---- Expanded detail ---- */

  .game-detail {
    padding: 4px 20px 22px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 4px;
  }

  .stat {
    background: rgba(244, 241, 234, 0.04);
    padding: 10px 12px;
    border-left: 2px solid var(--turf-line);
  }

  .stat-label {
    font-size: 11px;
    color: var(--chalk-dim);
    margin-bottom: 4px;
  }

  .stat-value {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 600;
  }

  .prob-bar {
    display: flex;
    height: 6px;
    margin-top: 14px;
    overflow: hidden;
  }

  .prob-away { background: var(--steel); }
  .prob-home { background: var(--amber); }

  .prob-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--chalk-dim);
    margin-top: 5px;
  }

  .signals {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .signal {
    font-size: 13px;
    padding: 7px 10px;
    border-left: 3px solid transparent;
    background: rgba(244, 241, 234, 0.03);
  }

  .signal-value { border-left-color: var(--green); }
  .signal-upset { border-left-color: var(--steel); }
  .signal-fade { border-left-color: var(--redflag); }
  .signal-prop-over { border-left-color: var(--green); }
  .signal-prop-under { border-left-color: var(--redflag); }

  .signal-side {
    font-weight: 600;
  }
  .signal-side-over { color: var(--green); }
  .signal-side-under { color: var(--redflag); }

  .signal-more {
    font-size: 12px;
    color: var(--chalk-dim);
    padding: 4px 10px;
  }

  /* Expandable signals (upset watch, prop over/under) — a details/summary
     wrapper around the existing .signal styling so the row itself stays
     unchanged when collapsed, and reveals a "why" panel underneath when tapped. */
  details.signal-expand {
    padding: 0;
    border-left: 3px solid transparent;
    background: rgba(244, 241, 234, 0.03);
  }

  details.signal-expand.signal-upset { border-left-color: var(--steel); }
  details.signal-expand.signal-prop-over { border-left-color: var(--green); }
  details.signal-expand.signal-prop-under { border-left-color: var(--redflag); }

  details.signal-expand > summary {
    font-size: 13px;
    padding: 7px 10px;
    cursor: pointer;
    list-style: none;
  }

  details.signal-expand > summary::-webkit-details-marker { display: none; }

  details.signal-expand > summary::after {
    content: ' — why?';
    color: var(--chalk-dim);
    font-size: 11px;
  }

  details.signal-expand[open] > summary::after {
    content: '';
  }

  .signal-why {
    padding: 2px 10px 10px;
    font-size: 12px;
    color: var(--chalk-dim);
    line-height: 1.5;
  }

  .form-compare {
    display: flex;
    gap: 16px;
    margin-top: 6px;
  }

  .form-side {
    flex: 1;
  }

  .form-side-label {
    font-size: 11px;
    color: var(--chalk);
    margin-bottom: 3px;
  }

  .form-scores {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .form-score {
    font-size: 11px;
    padding: 2px 6px;
    background: rgba(244, 241, 234, 0.06);
    border-radius: 3px;
  }

  .injury-report {
    margin-top: 14px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .injury-item {
    font-size: 12px;
    padding: 4px 9px;
    background: rgba(244, 241, 234, 0.04);
    color: var(--chalk-dim);
  }

  .injury-status-out { color: var(--redflag); }
  .injury-status-doubtful { color: var(--amber); }
  .injury-status-questionable { color: var(--steel); }

  .props-toggle {
    margin-top: 14px;
  }

  .props-toggle summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--chalk-dim);
    padding: 6px 0;
    list-style: none;
  }

  .props-toggle summary::-webkit-details-marker { display: none; }

  .props-toggle summary::before {
    content: '▸ ';
  }

  .props-toggle[open] summary::before {
    content: '▾ ';
  }

  .props-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 8px;
  }

  .prop-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 5px 8px;
    background: rgba(244, 241, 234, 0.03);
  }

  .prop-row-value.over { border-left: 2px solid var(--green); }
  .prop-row-value.under { border-left: 2px solid var(--redflag); }

  .signal-tag {
    font-weight: 600;
    margin-right: 6px;
  }

  @media (max-width: 480px) {
    .stat-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-value { font-size: 17px; }
    h1 { font-size: 27px; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Week's Board</div>
  <h1>NFL Signal Board</h1>
  <div class="updated" id="updated-text">Loading...</div>
</header>

<main id="main-content">
  <div class="empty-state">Loading predictions&hellip;</div>
</main>

<script>
async function loadDashboard() {
  const main = document.getElementById('main-content');
  const updatedText = document.getElementById('updated-text');

  try {
    const res = await fetch('./predictions.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('not found');
    const data = await res.json();

    const generated = new Date(data.generated_at);
    updatedText.textContent = 'Last updated ' + generated.toLocaleString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });

    if (!data.games || data.games.length === 0) {
      main.innerHTML = '<div class="empty-state">No upcoming games with posted odds right now. Check back closer to kickoff.</div>';
      return;
    }

    main.innerHTML = data.games.map(renderGame).join('');
  } catch (err) {
    main.innerHTML = '<div class="empty-state">No predictions yet. This page fills in after the first automated run finishes.</div>';
    updatedText.textContent = '';
  }
}

// Counts how many actionable signals a game has (value bets, upsets, fades,
// prop value bets) — drives both the color bar and the signal-count chip
// on the collapsed row, so you can tell at a glance which games are worth
// opening without expanding every card.
function countSignals(game) {
  let good = 0;
  let risk = 0;
  if (game.value_bet) good++;
  if (game.high_confidence) good++;
  if (game.upset_watch) good++;
  good += (game.player_props || []).filter(p => p.is_value_bet).length;
  risk += (game.scoring_fades || []).length;
  return { good, risk, total: good + risk };
}

// Rounds to 1 decimal place — model outputs come back as raw float32
// (e.g. 259.3999938964844), which is noise beyond one decimal for display.
function round1(n) {
  return Math.round(n * 10) / 10;
}

function renderUpsetSignal(upset) {
  const modelPct = Math.round(upset.model_prob * 100);
  const marketPct = Math.round(upset.market_prob * 100);
  const gap = modelPct - marketPct;

  const underdogScores = upset.underdog_recent_scores || [];
  const favoriteScores = upset.favorite_recent_scores || [];

  const formHtml = (underdogScores.length || favoriteScores.length) ? `
    <div class="form-compare">
      <div class="form-side">
        <div class="form-side-label">${upset.underdog} — last ${underdogScores.length}</div>
        <div class="form-scores">${underdogScores.map(s => `<span class="form-score">${round1(s)}</span>`).join('')}</div>
      </div>
      <div class="form-side">
        <div class="form-side-label">${upset.favorite || 'Favorite'} — last ${favoriteScores.length}</div>
        <div class="form-scores">${favoriteScores.map(s => `<span class="form-score">${round1(s)}</span>`).join('')}</div>
      </div>
    </div>
  ` : '';

  return `
    <details class="signal-expand signal-upset">
      <summary><span class="signal-tag">Upset watch</span>${upset.underdog} (+${upset.odds}) &middot; model ${modelPct}% vs market ${marketPct}%</summary>
      <div class="signal-why">
        The model rates ${upset.underdog}'s win chance ${gap} points higher than the market's implied probability.
        ${formHtml}
      </div>
    </details>
  `;
}

function renderPropSignal(prop) {
  const statLabel = prop.stat.replace('_', ' ');
  const sideClass = prop.side.toLowerCase() === 'over' ? 'over' : 'under';
  const predicted = round1(prop.predicted_value);
  const gap = round1(Math.abs(predicted - prop.line));
  const recentGames = prop.recent_games || [];

  const historyHtml = recentGames.length ? `
    <div class="form-compare">
      <div class="form-side">
        <div class="form-side-label">${prop.player} — last ${recentGames.length} games (${statLabel})</div>
        <div class="form-scores">${recentGames.map(v => `<span class="form-score">${round1(v)}</span>`).join('')}</div>
      </div>
    </div>
  ` : '';

  return `
    <details class="signal-expand signal-prop-${sideClass}">
      <summary>
        <span class="signal-tag">Prop value</span>${prop.player}
        <span class="signal-side signal-side-${sideClass}">${prop.side}</span>
        ${prop.line} ${statLabel} (model ${predicted})
        &middot; ${prop.odds > 0 ? '+' : ''}${prop.odds} &middot; ${prop.sportsbook}
      </summary>
      <div class="signal-why">
        The model projects ${prop.player} for ${predicted} ${statLabel}, ${gap} ${sideClass === 'over' ? 'above' : 'below'}
        the posted line of ${prop.line}.
        ${historyHtml}
      </div>
    </details>
  `;
}

function renderGame(game, idx) {
  const kickoff = game.commence_time
    ? new Date(game.commence_time).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
    : '';

  if (game.odds_pending) {
    return `
      <details class="game">
        <summary class="game-summary">
          <div class="call-bar neutral"></div>
          <div class="summary-main">
            <div class="summary-teams">${game.away_team} @ ${game.home_team}</div>
            <div class="summary-sub">${kickoff} &middot; Week ${game.week || ''}</div>
          </div>
          <span class="signal-count">pending</span>
          <span class="chevron">&#9656;</span>
        </summary>
        <div class="game-detail">
          <div class="signal signal-upset">Odds not posted yet — predictions will appear once a sportsbook prices this game.</div>
        </div>
      </details>
    `;
  }

  const homePct = Math.round(game.home_win_prob * 100);
  const awayPct = Math.round(game.away_win_prob * 100);
  const { good, risk, total } = countSignals(game);

  // The color bar on the collapsed row is the at-a-glance read: green means
  // the model found at least one favorable signal (value bet, high
  // confidence pick, upset watch, or a prop edge) and no fades outweigh it;
  // red means a scoring fade is the dominant signal; gray means nothing
  // stands out either way.
  let barClass = 'neutral';
  if (good > 0 && good >= risk) barClass = 'good';
  else if (risk > 0) barClass = 'risk';

  const pickTeam = game.predicted_margin > 0 ? game.home_team : game.away_team;
  const pickMargin = Math.abs(game.predicted_margin).toFixed(1);

  let signals = '';
  if (game.value_bet) {
    signals += `<div class="signal signal-value"><span class="signal-tag">Value bet</span>${game.value_bet.side} moneyline &middot; edge ${round1(game.value_bet.edge * 100)}pt &middot; ${game.value_bet.odds > 0 ? '+' : ''}${game.value_bet.odds}</div>`;
  }
  if (game.high_confidence) {
    signals += `<div class="signal signal-value"><span class="signal-tag">High confidence</span>${game.high_confidence.side} win prob ${Math.round(game.high_confidence.prob * 100)}%</div>`;
  }
  if (game.upset_watch) {
    signals += renderUpsetSignal(game.upset_watch);
  }
  (game.scoring_fades || []).forEach(fade => {
    signals += `<div class="signal signal-fade"><span class="signal-tag">Scoring fade</span>${fade.team} implied ${round1(fade.implied_total)}pts, averaging ${round1(fade.recent_avg)} over last ${fade.games_used}</div>`;
  });

  const valueProps = (game.player_props || [])
    .filter(p => p.is_value_bet)
    .sort((a, b) => b.edge - a.edge);

  valueProps.slice(0, 3).forEach(prop => {
    signals += renderPropSignal(prop);
  });
  if (valueProps.length > 3) {
    signals += `<div class="signal-more">+ ${valueProps.length - 3} more prop value${valueProps.length - 3 === 1 ? '' : 's'} below</div>`;
  }

  const countChip = total > 0
    ? `<span class="signal-count has-signals">${total} signal${total === 1 ? '' : 's'}</span>`
    : `<span class="signal-count">no edge</span>`;

  return `
    <details class="game">
      <summary class="game-summary">
        <div class="call-bar ${barClass}"></div>
        <div class="summary-main">
          <div class="summary-teams">${game.away_team} @ ${game.home_team}</div>
          <div class="summary-sub">
            <span class="summary-pick">${pickTeam} &minus;${pickMargin}</span>
            &middot; ${kickoff}
          </div>
        </div>
        ${countChip}
        <span class="chevron">&#9656;</span>
      </summary>

      <div class="game-detail">
        <div class="stat-grid">
          <div class="stat">
            <div class="stat-label">Predicted margin</div>
            <div class="stat-value">${pickTeam} ${pickMargin}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Predicted total</div>
            <div class="stat-value">${game.predicted_total.toFixed(1)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Market line</div>
            <div class="stat-value">${game.spread_line !== null ? game.spread_line : '—'} / ${game.total_line !== null ? game.total_line : '—'}</div>
          </div>
        </div>

        <div class="prob-bar">
          <div class="prob-away" style="width:${awayPct}%"></div>
          <div class="prob-home" style="width:${homePct}%"></div>
        </div>
        <div class="prob-labels">
          <span>${game.away_team} ${awayPct}%</span>
          <span>${game.home_team} ${homePct}%</span>
        </div>

        ${signals ? `<div class="signals">${signals}</div>` : ''}
        ${renderInjuryReport(game)}
        ${renderPropsToggle(game)}
      </div>
    </details>
  `;
}

function renderPropsToggle(game) {
  const props = game.player_props || [];
  if (props.length === 0) return '';

  const rows = props
    .sort((a, b) => b.edge - a.edge)
    .map(p => {
      const statLabel = p.stat.replace('_', ' ');
      const sideClass = p.side.toLowerCase() === 'over' ? 'over' : 'under';
      const rowClass = p.is_value_bet ? `prop-row prop-row-value ${sideClass}` : 'prop-row';
      return `<div class="${rowClass}">
        <span>${p.player} — <span class="signal-side signal-side-${sideClass}">${p.side}</span> ${p.line} ${statLabel} (model ${round1(p.predicted_value)})</span>
        <span>${p.odds > 0 ? '+' : ''}${p.odds}</span>
      </div>`;
    })
    .join('');

  return `
    <details class="props-toggle">
      <summary>All player props checked (${props.length})</summary>
      <div class="props-list">${rows}</div>
    </details>
  `;
}

function renderInjuryReport(game) {
  const report = game.injury_report;
  if (!report) return '';

  const allEntries = [
    ...(report.away || []).map(p => ({ ...p, team: game.away_team })),
    ...(report.home || []).map(p => ({ ...p, team: game.home_team })),
  ];

  if (allEntries.length === 0) return '';

  const items = allEntries.map(p => {
    const statusClass = 'injury-status-' + p.status.toLowerCase();
    return `<span class="injury-item">${p.team} — ${p.player}${p.position ? ' (' + p.position + ')' : ''}: <span class="${statusClass}">${p.status}</span></span>`;
  }).join('');

  return `<div class="injury-report">${items}</div>`;
}

loadDashboard();
</script>

</body>
</html>
